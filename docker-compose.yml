services:
  postgres:
    image: postgres:16-alpine
    container_name: zebl-lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zebl_lms
    ports:
      # Host 5433 avoids clash with local Windows PostgreSQL on 5432
      - "5433:5432"
    volumes:
      - zebl_lms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zebl_lms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zebl_lms_pgdata:
